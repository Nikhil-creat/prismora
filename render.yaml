services:
  - type: web
    name: prismora-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - { key: API_KEYS, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: CORS_ORIGINS, sync: false }
      - { key: PROVENANCE_SECRET, generateValue: true }
